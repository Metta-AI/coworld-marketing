[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coworld-marketing"
version = "0.2.1"
description = "Softmax Marketing: a continuous Coworld where people and agents submit X posts, an autograder judges them and real engagement decides the rest."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
marketing-game = "marketing.server:main"
marketing-check = "marketing.check:main"
marketing-agent = "marketing.agent:main"

[tool.hatch.build.targets.wheel]
packages = ["marketing"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
