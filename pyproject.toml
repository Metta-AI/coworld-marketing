[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coworld-video-marketing"
version = "0.1.0"
description = "Softmax Video Marketing: a daily Coworld where players submit a video and a judge scores it against the Softmax bar."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
svm-game = "videomarketing.server:main"
svm-check = "videomarketing.check:main"

[tool.hatch.build.targets.wheel]
packages = ["videomarketing"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
