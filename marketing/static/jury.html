<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing Jury</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Merriweather+Sans:wght@400;600;700&display=swap">
<style>
  :root {
    --bg:#fffdf4; --surface:#fffaf0; --surface-alt:#f8f6ef; --fg:#111827; --fg-subtle:#555555; --fg-muted:#6b6560;
    --navy:#1a3875; --sage:#5d6d41; --terracotta:#945637; --gold:#80601f; --accent:#5573a0; --accent-soft:#eef2f7;
    --border:#e4dac8; --border-strong:#d4c9b5; --border-subtle:#f0ebe1;
  }
  * { box-sizing:border-box; }
  html, body { background:var(--bg); color:var(--fg); margin:0; }
  body { font:15px/1.55 "Merriweather Sans", system-ui, sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:22px 20px 56px; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-subtle); }
  h1 { font:700 30px/1.15 Merriweather, Georgia, serif; margin:2px 0 6px; text-wrap:balance; }
  .masthead { border-bottom:2px solid var(--border-strong); padding-bottom:10px; margin-bottom:14px; }
  .brief { font:italic 400 14.5px/1.45 Merriweather, Georgia, serif; color:var(--fg-subtle); max-width:78ch; margin:4px 0 0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
  .brief.open { -webkit-line-clamp:unset; display:block; }
  .meta { display:flex; flex-wrap:wrap; gap:4px 16px; color:var(--fg-muted); font-size:13px; margin:8px 0 0; }
  .meta b { color:var(--fg); font-weight:600; }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gold); margin-right:6px; animation:pulse 1.5s ease infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

  .stage { position:relative; }
  .deck { position:relative; display:grid; grid-template-columns:minmax(0,1fr); }
  .postcard { max-width:600px; margin:0 auto; width:100%; background:var(--surface); border:1px solid var(--border); border-radius:6px; padding:16px 18px 14px; }
  .who { display:flex; gap:10px; align-items:center; }
  .avatar { width:40px; height:40px; border-radius:50%; background:var(--navy); color:#fffdf4; display:grid; place-items:center; font:700 16px/1 Merriweather, Georgia, serif; flex:none; }
  .who .name { font-weight:700; } .who .handle { color:var(--fg-muted); font-size:13px; }
  .text { font:400 17px/1.4 Merriweather, Georgia, serif; white-space:pre-wrap; margin:10px 0 0; overflow-wrap:anywhere; }
  .text:empty::before { content:"(no post text)"; color:var(--fg-muted); font-style:italic; }
  .media { margin-top:12px; border-radius:6px; overflow:hidden; background:#0e0e0e; }
  .media video, .media img { width:100%; max-height:62vh; display:block; object-fit:contain; background:#0e0e0e; }
  .media.grid { display:grid; gap:3px; grid-template-columns:1fr 1fr; }
  .media.grid img { width:100%; height:100%; max-height:none; aspect-ratio:1; object-fit:cover; }
  .media.grid.n3 img:first-child { grid-row:span 2; aspect-ratio:auto; }
  .alt { color:var(--fg-muted); font-size:12px; margin-top:6px; font-style:italic; }
  .engage { display:flex; flex-wrap:wrap; gap:4px 18px; margin-top:12px; padding-top:10px; border-top:1px solid var(--border-subtle); color:var(--fg-muted); font-size:13px; font-variant-numeric:tabular-nums; }
  .engage b { color:var(--fg); font-weight:600; }
  .engage a { color:var(--accent); text-decoration:none; } .engage a:hover { text-decoration:underline; }
  .nav { position:absolute; top:50%; transform:translateY(-50%); width:44px; height:44px; border-radius:50%; border:1px solid var(--border-strong); background:rgba(255,253,244,.92); color:var(--fg); font:700 22px/1 "Merriweather Sans", sans-serif; cursor:pointer; display:grid; place-items:center; padding:0 0 2px; box-shadow:0 1px 2px rgba(0,0,0,.18); }
  .nav:hover { background:var(--surface-alt); } .nav:active { background:var(--accent-soft); } .nav:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .nav[disabled] { opacity:.35; cursor:default; }
  .nav.prev { left:0; } .nav.next { right:0; }
  .counter { font:600 11px/1 "Merriweather Sans", sans-serif; letter-spacing:.1em; text-transform:uppercase; color:var(--fg-muted); text-align:center; margin:0 0 8px; }

  .strip { display:flex; gap:8px; margin:12px 0 0; overflow-x:auto; padding-bottom:4px; scrollbar-width:thin; justify-content:center; }
  .thumb { flex:none; width:118px; height:70px; border-radius:3px; overflow:hidden; border:2px solid transparent; background:var(--surface-alt); cursor:pointer; position:relative; padding:0; text-align:left; }
  .thumb img { width:100%; height:100%; object-fit:cover; display:block; opacity:.82; }
  .thumb .snippet { padding:6px 8px 6px 26px; font:400 10.5px/1.3 Merriweather, Georgia, serif; color:var(--fg-subtle); overflow:hidden; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; height:100%; }
  .thumb:hover img { opacity:1; } .thumb.current { border-color:var(--navy); } .thumb.current img { opacity:1; }
  .thumb:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .thumb .r { position:absolute; left:5px; top:4px; }
  .thumb img + .r .rank { color:#fffdf4; text-shadow:0 1px 2px rgba(0,0,0,.6); }

  .caption { display:grid; grid-template-columns:minmax(0,1fr) minmax(220px,40%); gap:4px 24px; align-items:start; margin-top:16px; }
  .rankline { display:flex; align-items:center; gap:10px; min-width:0; }
  .medal { width:24px; height:24px; border-radius:50%; display:inline-grid; place-items:center; font:700 12px/1 "Merriweather Sans", sans-serif; box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.08); flex:none; }
  .m1 { background:linear-gradient(180deg,#f4cf7a,#c28a2b); color:#3b2505; border:1px solid #a4731d; }
  .m2 { background:linear-gradient(180deg,#e8e8e8,#b0b0b0); color:#2a2a2a; border:1px solid #8a8a8a; }
  .m3 { background:linear-gradient(180deg,#dfa778,#9c5a2d); color:#3b1f0a; border:1px solid #7e4c26; }
  .rank { font:700 13px/1 "Merriweather Sans", sans-serif; color:var(--fg-muted); min-width:24px; text-align:center; }
  .thumb .medal { width:18px; height:18px; font-size:10px; }
  .title { font:700 20px/1.25 Merriweather, Georgia, serif; margin:0; }
  .by { color:var(--fg-muted); font-size:13px; margin-top:2px; }
  .chip { display:inline-block; height:20px; padding:0 7px; border-radius:3px; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; line-height:20px; background:var(--surface-alt); color:var(--fg-subtle); margin-left:6px; vertical-align:middle; }
  .chip.gold { background:rgba(128,96,31,.14); color:var(--gold); }
  .chip.err { background:rgba(179,110,78,.14); color:var(--terracotta); }
  .chip.ok { background:rgba(110,128,80,.14); color:var(--sage); }
  .chip.navy { background:rgba(26,56,117,.12); color:var(--navy); }
  .score { font:700 40px/1 Merriweather, Georgia, serif; font-variant-numeric:tabular-nums; text-align:right; }
  .score small { font:600 12px/1 "Merriweather Sans", sans-serif; color:var(--fg-muted); letter-spacing:.06em; margin-left:6px; }
  .sub { font-family: ui-monospace, Menlo, monospace; font-size:12px; color:var(--fg-subtle); font-variant-numeric:tabular-nums; text-align:right; margin-top:4px; line-height:1.5; }
  .halves { display:grid; grid-template-columns:1fr 1fr; gap:0 14px; margin-top:8px; text-align:right; }
  .halves div { font-size:12px; color:var(--fg-muted); } .halves b { display:block; font:700 18px/1.2 Merriweather, Georgia, serif; color:var(--fg); font-variant-numeric:tabular-nums; }
  .judge { grid-column:1 / -1; max-width:70ch; }
  .notes { font:400 15px/1.5 Merriweather, Georgia, serif; margin:8px 0 0; }
  .verdict { font:italic 400 15px/1.5 Merriweather, Georgia, serif; color:var(--fg-subtle); margin:8px 0 0; }
  .flags { color:var(--terracotta); font-size:13px; margin-top:6px; }
  .checks { margin:8px 0 0; padding:0; list-style:none; font-size:13px; color:var(--fg-subtle); }
  .checks li { padding:2px 0; border-top:1px solid var(--border-subtle); }
  .checks li.bad { color:var(--terracotta); }
  details summary { cursor:pointer; color:var(--fg-muted); font-size:13px; margin-top:10px; }
  .sheet { margin-top:10px; width:100%; border:1px solid var(--border); border-radius:3px; }
  .pick { margin-top:14px; border-left:3px solid var(--gold); padding:4px 12px; }
  .pick .eyebrow { color:var(--gold); }
  .pick p { margin:4px 0 8px; font:400 15px/1.5 Merriweather, Georgia, serif; white-space:pre-wrap; }
  button.copy { font:600 12px/1 "Merriweather Sans", sans-serif; border-radius:3px; padding:7px 10px; cursor:pointer; background:var(--surface); color:var(--fg); border:1px solid var(--border-strong); }
  button.copy:hover { background:var(--surface-alt); } button.copy:active { background:var(--accent-soft); } button.copy:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .empty { border:1px dashed var(--border); padding:28px; text-align:center; color:var(--fg-muted); font-style:italic; }
  .error { border-left:3px solid var(--terracotta); background:rgba(179,110,78,.06); padding:10px 14px; margin:18px 0; }
  @media (max-width: 720px) {
    main { padding:16px 16px 48px; } h1 { font-size:26px; }
    .caption { grid-template-columns:1fr; } .score, .sub, .halves { text-align:left; }
    .nav { width:40px; height:40px; } .thumb { width:96px; height:60px; }
    .nav.prev { left:-6px; } .nav.next { right:-6px; }
  }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="eyebrow">Softmax Marketing</div>
    <h1 id="headline">Jury</h1>
    <p class="brief" id="brief" title="Click to expand"></p>
    <div class="meta" id="meta"></div>
  </header>
  <div id="error" hidden></div>
  <section class="stage" id="stage" aria-live="polite"><div class="empty">No entries yet.</div></section>
</main>
<script>
(function () {
  const post = (m) => { if (window.parent !== window) window.parent.postMessage({ src: 'coworld-replay', ...m }, '*'); };
  post({ type: 'loading' });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const num = (n) => Number(n || 0).toLocaleString('en-US');
  let mediaSrc = (slot, index) => new URL(`../media/${slot}/${index || 0}`, location.href).toString();
  const blobUrls = {};
  let state = { phase: 'waiting', done: false, brief: '', account: 'softmaxresearch', feed: null, entries: [], results: null, mode: 'live', threshold: 70, weight: 0.5 };
  let index = 0;
  let slides = [];
  let videoEl = null;

  $('brief').addEventListener('click', () => $('brief').classList.toggle('open'));

  function showError(message) {
    const el = $('error'); el.hidden = false; el.className = 'error'; el.textContent = message;
    post({ type: 'error', message });
  }

  function medal(rank, cls) {
    if (rank <= 3) return `<span class="medal m${rank} ${cls || ''}">${rank}</span>`;
    return `<span class="rank ${cls || ''}">${rank}</span>`;
  }

  // Collapse identical submissions (filler seats repeat a real entry) into one slide.
  function buildSlides() {
    const list = state.entries.slice();
    if (state.done) list.sort((a, b) => (b.score - a.score) || (b.judge - a.judge) || (a.slot - b.slot));
    const seen = new Map();
    const out = [];
    for (const e of list) {
      const key = (e.content_hash && e.kind !== 'invalid') ? e.content_hash : `slot-${e.slot}`;
      if (seen.has(key)) { seen.get(key).seats.push(e.slot); continue; }
      const s = { entry: e, seats: [e.slot] };
      seen.set(key, s); out.push(s);
    }
    return out;
  }

  function renderMeta() {
    const r = state.results;
    const bits = [];
    if (!state.done) bits.push(`<span><span class="pulse"></span>${esc(state.phase)}</span>`);
    else bits.push(`<span>Judged · <b>${r ? esc(r.judge_mode) : ''}</b>${r && r.judge_model ? ' · ' + esc(r.judge_model) : ''}</span>`);
    const dup = state.entries.length - slides.length;
    bits.push(`<span><b>${slides.length}</b> ${slides.length === 1 ? 'post' : 'posts'}${dup > 0 ? ` <span style="color:var(--fg-muted)">(${state.entries.length} seats)</span>` : ''}</span>`);
    const posted = slides.filter(s => s.entry.posted).length;
    if (posted) bits.push(`<span><b>${posted}</b> live on @${esc(state.account)}</span>`);
    if (r) {
      const postable = slides.filter(s => r.postable[s.entry.slot]).length;
      bits.push(`<span><b>${postable}</b> ready to post (judge ≥ ${esc(state.threshold)})</span>`);
    }
    if (state.feed) bits.push(state.feed.available ? `<span>engagement as of <b>${esc((state.feed.generated_at || '').replace('T', ' ').slice(0, 16))}</b></span>` : '<span>no engagement feed</span>');
    $('meta').innerHTML = bits.join('');
    $('brief').textContent = state.brief || '';
    $('headline').textContent = state.done && r && r.pick != null ? 'Next to post' : 'Jury';
  }

  // Attachments: a list since replay version 3; older entries carried one item in top-level fields.
  function mediaItems(e) {
    if (Array.isArray(e.media)) return e.media;
    if (e.media_kind && e.media_kind !== 'none') return [{ index: 0, kind: e.media_kind, alt_text: e.alt_text || '', poster: e.poster || '' }];
    return [];
  }
  function slideMediaSrc(e, i) { return blobUrls[`${e.slot}/${i}`] || (state.mode === 'replay' ? null : mediaSrc(e.slot, i)); }

  function mediaBlock(e) {
    const items = mediaItems(e);
    if (!items.length) return '';
    const first = items[0];
    const posterOf = (it, i) => (it.poster || (i === 0 ? e.poster : '')) ? `data:image/jpeg;base64,${it.poster || e.poster}` : '';
    if (first.kind === 'video') {
      const src = slideMediaSrc(e, 0), poster = posterOf(first, 0);
      if (!src && !poster) return '';
      return `<div class="media"><video id="video" controls playsinline muted autoplay loop preload="metadata"${poster ? ` poster="${poster}"` : ''}${src ? ` src="${src}"` : ''}></video></div>`;
    }
    const imgs = items.map((it, i) => {
      const url = slideMediaSrc(e, i) || posterOf(it, i);
      return url ? `<img alt="${esc(it.alt_text || `picture ${i + 1} of ${items.length}`)}" src="${url}">` : '';
    }).filter(Boolean);
    if (!imgs.length) return '';
    if (imgs.length === 1) return `<div class="media">${imgs[0]}</div>`;
    return `<div class="media grid n${imgs.length}">${imgs.join('')}</div>`;
  }

  function altBlock(e) {
    const items = mediaItems(e).filter(it => it.alt_text);
    if (!items.length) return '';
    if (mediaItems(e).length === 1) return `<div class="alt">Alt: ${esc(items[0].alt_text)}</div>`;
    return `<div class="alt">${items.map(it => `Alt ${it.index + 1}: ${esc(it.alt_text)}`).join(' · ')}</div>`;
  }

  function engagementBlock(e) {
    if (!e.posted || !e.post) {
      return e.room_ships ? `<div class="engage"><span><b>${num(e.room_ships)}</b> ${e.room_ships === 1 ? 'ship' : 'ships'} in the room</span></div>` : '';
    }
    const m = e.post.metrics || {};
    const link = e.post.url ? `<a href="${esc(e.post.url)}" target="_blank" rel="noopener">on X</a>` : '';
    return `<div class="engage"><span><b>${num(m.impressions)}</b> impressions</span><span><b>${num(m.likes)}</b> likes</span><span><b>${num(m.reposts)}</b> reposts</span><span><b>${num(m.replies)}</b> replies</span>${m.quotes != null ? `<span><b>${num(m.quotes)}</b> quotes</span>` : ''}<span>${esc((e.post.posted_at || '').slice(0, 10))} ${link}</span></div>`;
  }

  function renderStage() {
    const stage = $('stage');
    if (!slides.length) { stage.innerHTML = '<div class="empty">No entries yet.</div>'; videoEl = null; return; }
    index = Math.max(0, Math.min(index, slides.length - 1));
    const r = state.results;
    const { entry: e, seats } = slides[index];
    const rank = index + 1;
    const isPick = r && r.pick != null && seats.includes(r.pick);

    const strip = slides.map((s, i) => `<button type="button" class="thumb${i === index ? ' current' : ''}" data-i="${i}" aria-label="Show ${esc(s.entry.label)}">${s.entry.poster ? `<img alt="" src="data:image/jpeg;base64,${s.entry.poster}">` : `<div class="snippet">${esc(s.entry.text || s.entry.label)}</div>`}<span class="r">${state.done ? medal(i + 1) : `<span class="rank">${s.entry.slot + 1}</span>`}</span></button>`).join('');

    const chips = (e.media_kind && e.media_kind !== 'none' ? `<span class="chip">${esc(e.media_kind)}</span>` : '<span class="chip">text</span>') +
      (e.posted ? '<span class="chip navy">Live on X</span>' : '') +
      (isPick ? '<span class="chip gold">Next to post</span>' : '') +
      (state.done && !e.eligible ? '<span class="chip err">Ineligible</span>' : '') +
      (state.done && e.eligible && r && r.postable[e.slot] && !isPick ? '<span class="chip ok">Ready to post</span>' : '');
    const t = e.technical, c = e.craft;
    let sub = '';
    if (state.done && t) sub = `technical ${Number(t.score).toFixed(0)}` + (c ? ` · craft ${Number(c.score).toFixed(0)} (hook ${c.scores.hook} · specific ${c.scores.specific} · voice ${c.scores.voice} · legible ${c.scores.legible} · craft ${c.scores.craft} · repostable ${c.scores.repostable})${c.cached ? ' · cached' : ''}` : (e.craft_unavailable ? ' · craft panel unavailable' : ''));
    const w = Math.round(state.weight * 100);
    const halves = state.done ? `<div class="halves"><div>judge · ${100 - w}%<b>${Number(e.judge).toFixed(1)}</b></div><div>engagement · ${w}%${e.posted ? '' : ' · room'}<b>${e.posted || e.room_ships ? Number(e.engagement).toFixed(1) : '—'}</b></div></div>` : '';
    const scoreBlock = state.done ? `<div><div class="score">${Number(e.score).toFixed(1)}<small>/ 100</small></div>${halves}<div class="sub">${esc(sub)}</div></div>` : `<div class="sub">${esc(e.status)}</div>`;
    const techVerdict = state.done && r ? String(r.verdicts[e.slot] || '') : '';
    const judge = c ? `<p class="notes">${esc(c.notes)}</p>${c.cringe_flags && c.cringe_flags.length ? `<div class="flags">Flags: ${esc(c.cringe_flags.join('; '))}</div>` : ''}<p class="verdict">${esc(c.verdict)}</p>` :
      (techVerdict && !techVerdict.startsWith('Technical panel') ? `<p class="verdict">${esc(techVerdict)}</p>` : (e.craft_unavailable ? '<p class="verdict">Craft panel unavailable; judged on the technical panel only.</p>' : ''));
    const fails = t ? t.checks.filter(x => !x.ok) : [];
    const checks = state.done && t ? `<details><summary>Technical panel: ${fails.length ? fails.length + ' finding' + (fails.length > 1 ? 's' : '') : 'every check passed'}${e.problems && e.problems.length ? ' · package notes' : ''}</summary><ul class="checks">${t.checks.map(x => `<li class="${x.ok ? '' : 'bad'}">${esc(x.id)} — ${esc(x.detail)}${x.ok ? '' : (x.gate ? ' (gate)' : ` (−${x.penalty})`)}</li>`).join('')}${(e.problems || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>${e.sheet ? `<img class="sheet" alt="Contact sheet for ${esc(e.label)}" src="data:image/jpeg;base64,${e.sheet}">` : ''}${e.notes ? `<p class="notes">Entrant's notes: ${esc(e.notes)}</p>` : ''}</details>` : '';
    const pickBlock = isPick ? `<div class="pick"><div class="eyebrow">Post text · ${e.weighted_length}/280</div><p>${esc(e.text || '(no post text supplied)')}</p>${e.alt_text ? `<div class="eyebrow">Alt text</div><p>${esc(e.alt_text)}</p>` : ''}<button type="button" class="copy" data-copy="${esc(e.text || '')}">Copy post text</button></div>` : '';
    const seatsNote = seats.length > 1 ? ` · seated in ${seats.length} slots` : '';

    stage.innerHTML = `
      <div class="counter">${index + 1} of ${slides.length}</div>
      <div class="deck">
        <article class="postcard">
          <div class="who"><div class="avatar">S</div><div><div class="name">Softmax</div><div class="handle">@${esc(state.account)}</div></div></div>
          <p class="text">${esc(e.text || '')}</p>
          ${mediaBlock(e)}
          ${altBlock(e)}
          ${engagementBlock(e)}
        </article>
        <button type="button" class="nav prev" aria-label="Previous post" ${slides.length < 2 ? 'disabled' : ''}>‹</button>
        <button type="button" class="nav next" aria-label="Next post" ${slides.length < 2 ? 'disabled' : ''}>›</button>
      </div>
      <div class="strip" role="tablist">${strip}</div>
      <div class="caption">
        <div class="rankline">${state.done ? medal(rank) : `<span class="rank">${e.slot + 1}</span>`}<div style="min-width:0"><h2 class="title">${esc(e.label)}${chips}</h2><div class="by">by ${esc(e.name)}${e.duration ? ' · ' + Math.round(e.duration) + ' s' : ''}${e.thesis ? ' · <i>' + esc(e.thesis) + '</i>' : ''}${seatsNote}</div></div></div>
        ${scoreBlock}
        <div class="judge">${judge}${checks}${pickBlock}</div>
      </div>`;

    videoEl = document.getElementById('video');
    stage.querySelector('.nav.prev').addEventListener('click', () => step(-1));
    stage.querySelector('.nav.next').addEventListener('click', () => step(1));
    stage.querySelectorAll('.thumb').forEach(b => b.addEventListener('click', () => go(Number(b.dataset.i))));
    const current = stage.querySelector('.thumb.current');
    if (current && current.scrollIntoView) current.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    stage.querySelectorAll('button.copy').forEach(b => b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; } catch { b.textContent = 'Select and copy the text above'; }
      setTimeout(() => { b.textContent = 'Copy post text'; }, 1800);
    }));
    if (videoEl) { const p = videoEl.play(); if (p && p.catch) p.catch(() => {}); }
  }

  function go(i) { if (!slides.length) return; index = (i + slides.length) % slides.length; renderStage(); }
  function step(d) { go(index + d); }
  document.addEventListener('keydown', (ev) => {
    if (ev.target && /input|textarea/i.test(ev.target.tagName)) return;
    if (ev.key === 'ArrowLeft') { step(-1); ev.preventDefault(); }
    if (ev.key === 'ArrowRight') { step(1); ev.preventDefault(); }
  });

  function render() { slides = buildSlides(); renderMeta(); renderStage(); }

  function applyReplay(replay) {
    state.mode = 'replay';
    state.done = true; state.phase = 'complete';
    state.brief = replay.brief || (replay.config && replay.config.brief) || '';
    state.account = replay.account || (replay.config && replay.config.account) || state.account;
    state.feed = replay.feed || null;
    const cfg = replay.config || {};
    state.threshold = cfg.judge ? cfg.judge.postable_threshold : 70;
    state.weight = cfg.engagement ? cfg.engagement.weight : 0.5;
    state.entries = replay.entries || [];
    state.results = replay.results || null;
    const media = replay.media || {};
    for (const [slot, value] of Object.entries(media)) {
      const list = Array.isArray(value) ? value : [value];  // version 2 replays: one string per seat
      const entry = state.entries.find(x => x.slot === Number(slot));
      const items = entry ? mediaItems(entry) : [];
      list.forEach((b64, i) => {
        try {
          const bin = atob(b64); const bytes = new Uint8Array(bin.length);
          for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
          const type = (items[i] && items[i].mime) || (entry && entry.media_mime) || 'application/octet-stream';
          blobUrls[`${slot}/${i}`] = URL.createObjectURL(new Blob([bytes], { type }));
        } catch (e) { console.warn('media decode failed for slot', slot, 'index', i, e); }
      });
    }
    // Filler seats repeat a real entry's bytes: share its blobs by content hash.
    const byHash = {};
    for (const e of state.entries) if (e.content_hash && blobUrls[`${e.slot}/0`]) byHash[e.content_hash] = e.slot;
    for (const e of state.entries) {
      const src = e.content_hash != null ? byHash[e.content_hash] : undefined;
      if (src == null || src === e.slot || blobUrls[`${e.slot}/0`]) continue;
      mediaItems(e).forEach((_, i) => { if (blobUrls[`${src}/${i}`]) blobUrls[`${e.slot}/${i}`] = blobUrls[`${src}/${i}`]; });
    }
    index = 0;
    render();
  }

  async function inflate(bytes, format) {
    const ds = new DecompressionStream(format);
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function loadReplay(url) {
    post({ type: 'phase', phase: 'bundle_ready' });
    post({ type: 'phase', phase: 'replay_fetch_start' });
    const res = await fetch(url);
    if (!res.ok) throw new Error(`replay fetch failed: HTTP ${res.status}`);
    let bytes = new Uint8Array(await res.arrayBuffer());
    const gzip = bytes[0] === 0x1f && bytes[1] === 0x8b;
    const zlib = (bytes[0] & 15) === 8 && bytes[0] >> 4 <= 7 && ((bytes[0] << 8) | bytes[1]) % 31 === 0;
    post({ type: 'phase', phase: 'replay_fetch_end', bytes: bytes.byteLength, compressed: gzip || zlib });
    if (gzip) bytes = await inflate(bytes, 'gzip'); else if (zlib) bytes = await inflate(bytes, 'deflate');
    const replay = JSON.parse(new TextDecoder().decode(bytes));
    if (!replay || (replay.game !== 'marketing' && replay.game !== 'softmax-video-marketing') || !Array.isArray(replay.entries)) throw new Error('not a Softmax Marketing replay');
    post({ type: 'phase', phase: 'replay_parsed' });
    applyReplay(replay);
    setTimeout(() => post({ type: 'ready' }), 0);
  }

  function connectLive() {
    state.mode = 'live';
    const url = new URL('../global', location.href); url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(url.toString());
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      const before = slides[index] ? slides[index].entry.slot : null;
      if (m.type === 'snapshot') { state.phase = m.phase; state.done = m.done; state.brief = m.brief; state.account = m.account || state.account; state.feed = m.feed || null; state.entries = m.entries; state.results = m.results; }
      else if (m.type === 'phase') state.phase = m.phase;
      else if (m.type === 'feed') state.feed = m;
      else if (m.type === 'seat') { const i = state.entries.findIndex(e => e.slot === m.seat.slot); if (i >= 0) state.entries[i] = { ...state.entries[i], ...m.seat }; else state.entries.push(m.seat); }
      else if (m.type === 'final') { state.results = m.results; state.done = true; state.phase = 'complete'; }
      slides = buildSlides();
      if (before != null) { const j = slides.findIndex(s => s.seats.includes(before)); if (j >= 0 && m.type !== 'final') index = j; }
      if (m.type === 'final') index = 0;
      renderMeta();
      const currentSlot = slides[index] ? slides[index].entry.slot : null;
      if (m.type !== 'seat' || m.seat.slot === currentSlot || !videoEl) renderStage();
    };
    ws.onerror = () => showError('Live connection failed.');
    ws.onclose = () => { if (!state.done) $('meta').insertAdjacentHTML('beforeend', '<span>connection closed</span>'); };
    setTimeout(() => post({ type: 'ready' }), 0);
  }

  const replayParam = new URLSearchParams(location.hash.slice(1)).get('replay') || new URLSearchParams(location.search).get('replay');
  if (replayParam) {
    loadReplay(replayParam).catch(err => showError(String(err.message || err)));
  } else if (/\/client\/replay\/?$/.test(location.pathname)) {
    loadReplay(new URL('../replay.json', location.href).toString()).catch(err => showError(String(err.message || err)));
  } else {
    connectLive();
  }
})();
</script>
</body>
</html>
