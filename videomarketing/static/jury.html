<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Jury</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&family=Merriweather+Sans:wght@400;600;700&display=swap">
<style>
  :root {
    --bg:#fffdf4; --surface:#fffaf0; --surface-alt:#f8f6ef; --fg:#111827; --fg-subtle:#555555; --fg-muted:#6b6560;
    --navy:#1a3875; --sage:#5d6d41; --terracotta:#945637; --gold:#80601f; --accent:#5573a0; --accent-soft:#eef2f7;
    --border:#e4dac8; --border-strong:#d4c9b5; --border-subtle:#f0ebe1; --exclusive:#8f5b3f;
  }
  * { box-sizing:border-box; }
  html, body { background:var(--bg); color:var(--fg); margin:0; }
  body { font:15px/1.55 "Merriweather Sans", system-ui, sans-serif; }
  main { max-width:960px; margin:0 auto; padding:28px 20px 72px; }
  .eyebrow { font-size:11px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--fg-subtle); }
  h1 { font:700 34px/1.15 Merriweather, Georgia, serif; margin:4px 0 10px; text-wrap:balance; }
  .masthead { border-bottom:2px solid var(--border-strong); padding-bottom:14px; margin-bottom:6px; }
  .brief { font:italic 400 16px/1.5 Merriweather, Georgia, serif; color:var(--fg-subtle); max-width:68ch; margin:8px 0 0; }
  .meta { display:flex; flex-wrap:wrap; gap:6px 18px; color:var(--fg-muted); font-size:13px; margin:12px 0 0; }
  .meta b { color:var(--fg); font-weight:600; }
  .pulse { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gold); margin-right:6px; animation:pulse 1.5s ease infinite; vertical-align:middle; }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  h2 { font:700 12px/1.3 Merriweather, Georgia, serif; letter-spacing:.12em; text-transform:uppercase; color:var(--navy); margin:34px 0 10px; }
  .entry { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:18px 28px; padding:22px 0; border-bottom:1px solid var(--border); }
  .entry:last-child { border-bottom:0; }
  .entry.pick { background:linear-gradient(90deg, rgba(128,96,31,.06), transparent 60%); margin:0 -20px; padding:22px 20px; border-bottom:1px solid var(--border); }
  .rankline { display:flex; align-items:baseline; gap:12px; }
  .medal { width:24px; height:24px; border-radius:50%; display:inline-grid; place-items:center; font:700 12px/1 "Merriweather Sans", sans-serif; box-shadow:inset 0 1px 0 rgba(255,255,255,.3), inset 0 -1px 0 rgba(0,0,0,.08); flex:none; }
  .m1 { background:linear-gradient(180deg,#f4cf7a,#c28a2b); color:#3b2505; border:1px solid #a4731d; }
  .m2 { background:linear-gradient(180deg,#e8e8e8,#b0b0b0); color:#2a2a2a; border:1px solid #8a8a8a; }
  .m3 { background:linear-gradient(180deg,#dfa778,#9c5a2d); color:#3b1f0a; border:1px solid #7e4c26; }
  .rank { font:700 15px/1 "Merriweather Sans", sans-serif; color:var(--fg-muted); min-width:24px; text-align:center; }
  .title { font:700 22px/1.25 Merriweather, Georgia, serif; margin:0; }
  .by { color:var(--fg-muted); font-size:13px; margin-top:2px; }
  .chip { display:inline-block; height:20px; padding:0 7px; border-radius:3px; font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; line-height:20px; background:var(--surface-alt); color:var(--fg-subtle); margin-left:6px; vertical-align:middle; }
  .chip.gold { background:rgba(128,96,31,.14); color:var(--gold); }
  .chip.err { background:rgba(179,110,78,.14); color:var(--terracotta); }
  .chip.ok { background:rgba(110,128,80,.14); color:var(--sage); }
  .score { font:700 40px/1 Merriweather, Georgia, serif; font-variant-numeric:tabular-nums; margin:10px 0 2px; }
  .score small { font:600 12px/1 "Merriweather Sans", sans-serif; color:var(--fg-muted); letter-spacing:.06em; margin-left:6px; }
  .sub { font-family: ui-monospace, Menlo, monospace; font-size:12.5px; color:var(--fg-subtle); font-variant-numeric:tabular-nums; }
  .notes { font:400 15px/1.5 Merriweather, Georgia, serif; margin:10px 0 0; max-width:62ch; }
  .verdict { font:italic 400 15px/1.5 Merriweather, Georgia, serif; color:var(--fg-subtle); margin:8px 0 0; }
  .flags { color:var(--terracotta); font-size:13px; margin-top:6px; }
  .checks { margin:8px 0 0; padding:0; list-style:none; font-size:13px; color:var(--fg-subtle); }
  .checks li { padding:2px 0; border-top:1px solid var(--border-subtle); }
  .checks li.bad { color:var(--terracotta); }
  video { width:100%; aspect-ratio:16/9; background:#0e0e0e; border-radius:3px; display:block; }
  .noimg { width:100%; aspect-ratio:16/9; display:grid; place-items:center; color:var(--fg-muted); border:1px dashed var(--border); border-radius:3px; font-style:italic; }
  .post { margin-top:14px; border-left:3px solid var(--gold); padding:4px 12px; }
  .post .eyebrow { color:var(--gold); }
  .post p { margin:4px 0 8px; font:400 15px/1.5 Merriweather, Georgia, serif; white-space:pre-wrap; }
  button { font:600 12px/1 "Merriweather Sans", sans-serif; border-radius:3px; padding:7px 10px; cursor:pointer; background:var(--surface); color:var(--fg); border:1px solid var(--border-strong); }
  button:hover { background:var(--surface-alt); } button:active { background:var(--accent-soft); } button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  details summary { cursor:pointer; color:var(--fg-muted); font-size:13px; margin-top:8px; }
  .empty { border:1px dashed var(--border); padding:28px; text-align:center; color:var(--fg-muted); font-style:italic; }
  .error { border-left:3px solid var(--terracotta); background:rgba(179,110,78,.06); padding:10px 14px; margin:18px 0; }
  .sheet { margin-top:10px; width:100%; border:1px solid var(--border); border-radius:3px; }
  @media (max-width: 720px) { .entry { grid-template-columns:1fr; } .entry.pick { margin:0 -16px; padding:18px 16px; } main { padding:20px 16px 56px; } h1 { font-size:28px; } }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <div class="eyebrow">Softmax Video Marketing</div>
    <h1 id="headline">Daily jury</h1>
    <p class="brief" id="brief"></p>
    <div class="meta" id="meta"></div>
  </header>
  <div id="error" hidden></div>
  <section>
    <h2 id="section-title">Entries</h2>
    <div id="entries"><div class="empty">No entries yet.</div></div>
  </section>
</main>
<script>
(function () {
  const post = (m) => { if (window.parent !== window) window.parent.postMessage({ src: 'coworld-replay', ...m }, '*'); };
  post({ type: 'loading' });
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmtDur = (d) => d == null ? '' : `${Math.round(d)} s`;
  let mediaSrc = (slot) => new URL(`../media/${slot}.mp4`, location.href).toString();
  const blobUrls = {};
  let state = { phase: 'waiting', done: false, brief: '', entries: [], results: null, mode: 'live' };

  function showError(message) {
    const el = $('error'); el.hidden = false; el.className = 'error'; el.textContent = message;
    post({ type: 'error', message });
  }

  function medal(rank) {
    if (rank <= 3) return `<span class="medal m${rank}">${rank}</span>`;
    return `<span class="rank">${rank}</span>`;
  }

  function renderMeta() {
    const r = state.results;
    const bits = [];
    if (!state.done) bits.push(`<span><span class="pulse"></span>${esc(state.phase)}</span>`);
    else bits.push(`<span>Judged · <b>${r ? esc(r.judge_mode) : ''}</b>${r && r.judge_model ? ' · ' + esc(r.judge_model) : ''}</span>`);
    bits.push(`<span><b>${state.entries.length}</b> ${state.entries.length === 1 ? 'entry' : 'entries'}</span>`);
    if (r) {
      const n = r.postable.filter(Boolean).length;
      bits.push(`<span><b>${n}</b> postable (score ≥ ${esc(state.threshold ?? 70)})</span>`);
      bits.push(`<span>top <b>${Number(r.top_score).toFixed(1)}</b> / 100</span>`);
    }
    $('meta').innerHTML = bits.join('');
    $('brief').textContent = state.brief || '';
    $('headline').textContent = state.done ? (r && r.feed_pick != null ? 'Today’s pick' : 'Daily jury') : 'Daily jury';
    $('section-title').textContent = state.done ? 'Ranking' : 'Entries';
  }

  function videoFor(e, autoplay) {
    const src = blobUrls[e.slot] || mediaSrc(e.slot);
    const poster = e.poster ? ` poster="data:image/jpeg;base64,${e.poster}"` : '';
    if (!e.poster && !blobUrls[e.slot] && state.mode === 'replay') return `<div class="noimg">No video in this replay</div>`;
    return `<video controls preload="metadata" playsinline ${autoplay ? 'autoplay muted loop' : ''}${poster} src="${src}"></video>`;
  }

  function renderEntries() {
    const r = state.results;
    const list = state.entries.slice();
    if (state.done) list.sort((a, b) => (b.score - a.score) || (a.slot - b.slot));
    if (!list.length) { $('entries').innerHTML = '<div class="empty">No entries yet.</div>'; return; }
    $('entries').innerHTML = list.map((e, i) => {
      const rank = i + 1;
      const isPick = r && r.feed_pick === e.slot;
      const chips = `<span class="chip">${esc(e.format)}</span>` + (isPick ? '<span class="chip gold">Feed pick</span>' : '') +
        (state.done && !e.eligible ? '<span class="chip err">Ineligible</span>' : '') +
        (state.done && e.eligible && r && r.postable[e.slot] && !isPick ? '<span class="chip ok">Postable</span>' : '');
      const t = e.technical, c = e.craft;
      let sub = '';
      if (state.done && t) {
        sub = `technical ${Number(t.score).toFixed(0)}` + (c ? ` · craft ${Number(c.score).toFixed(0)} (legible ${c.scores.legible} · story ${c.scores.story_not_statement} · motion ${c.scores.motion} · voice ${c.scores.voice} · craft ${c.scores.craft} · postable ${c.scores.postable})` : (e.craft_unavailable ? ' · craft panel unavailable' : ''));
      }
      const fails = t ? t.checks.filter(x => !x.ok) : [];
      const checks = state.done && t ? `<details><summary>Technical panel: ${fails.length ? fails.length + ' finding' + (fails.length > 1 ? 's' : '') : 'every check passed'}</summary><ul class="checks">${t.checks.map(x => `<li class="${x.ok ? '' : 'bad'}">${esc(x.id)} — ${esc(x.detail)}${x.ok ? '' : (x.gate ? ' (gate)' : ` (−${x.penalty})`)}</li>`).join('')}</ul>${e.sheet ? `<img class="sheet" alt="Contact sheet for ${esc(e.title)}" src="data:image/jpeg;base64,${e.sheet}">` : ''}</details>` : '';
      const notes = c ? `<p class="notes">${esc(c.notes)}</p>${c.cringe_flags && c.cringe_flags.length ? `<div class="flags">Flags: ${esc(c.cringe_flags.join('; '))}</div>` : ''}<p class="verdict">${esc(c.verdict)}</p>` :
        (state.done && r ? `<p class="verdict">${esc(r.verdicts[e.slot])}</p>` : '');
      const postBlock = isPick ? `<div class="post"><div class="eyebrow">Post text · ${(e.post || '').length}/280</div><p>${esc(e.post || '(no post text supplied)')}</p>${e.alt_text ? `<div class="eyebrow">Alt text</div><p>${esc(e.alt_text)}</p>` : ''}<button type="button" data-copy="${esc(e.post || '')}">Copy post text</button></div>` : '';
      const score = state.done ? `<div class="score">${Number(e.score).toFixed(1)}<small>/ 100</small></div><div class="sub">${esc(sub)}</div>` : `<div class="sub">${esc(e.status)}${e.duration ? ' · ' + fmtDur(e.duration) + ` · ${e.width}x${e.height}` : ''}</div>`;
      return `<article class="entry${isPick ? ' pick' : ''}" id="entry-${e.slot}">
        <div>${videoFor(e, state.done && (isPick || (r && r.feed_pick == null && i === 0)))}</div>
        <div>
          <div class="rankline">${state.done ? medal(rank) : `<span class="rank">${e.slot + 1}</span>`}<div><h3 class="title">${esc(e.title)}${chips}</h3><div class="by">by ${esc(e.name)}${e.duration ? ' · ' + fmtDur(e.duration) : ''}${e.thesis ? ' · <i>' + esc(e.thesis) + '</i>' : ''}</div></div></div>
          ${score}
          ${notes}
          ${checks}
          ${postBlock}
        </div>
      </article>`;
    }).join('');
    document.querySelectorAll('button[data-copy]').forEach(b => b.addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; } catch { b.textContent = 'Select and copy the text above'; }
      setTimeout(() => { b.textContent = 'Copy post text'; }, 1800);
    }));
  }

  function render() { renderMeta(); renderEntries(); }

  function applyReplay(replay) {
    state.mode = 'replay';
    state.done = true; state.phase = 'complete';
    state.brief = replay.brief || (replay.config && replay.config.brief) || '';
    state.threshold = replay.config && replay.config.judge ? replay.config.judge.postable_threshold : 70;
    state.entries = replay.entries || [];
    state.results = replay.results || null;
    const media = replay.media || {};
    for (const [slot, b64] of Object.entries(media)) {
      try {
        const bin = atob(b64); const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        blobUrls[Number(slot)] = URL.createObjectURL(new Blob([bytes], { type: 'video/mp4' }));
      } catch (e) { console.warn('media decode failed for slot', slot, e); }
    }
    render();
  }

  async function inflate(bytes, format) {
    const ds = new DecompressionStream(format);
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  async function loadReplay(url) {
    post({ type: 'phase', phase: 'bundle_ready' });
    post({ type: 'phase', phase: 'replay_fetch_start' });
    const res = await fetch(url);
    if (!res.ok) throw new Error(`replay fetch failed: HTTP ${res.status}`);
    let bytes = new Uint8Array(await res.arrayBuffer());
    const gzip = bytes[0] === 0x1f && bytes[1] === 0x8b;
    const zlib = (bytes[0] & 15) === 8 && bytes[0] >> 4 <= 7 && ((bytes[0] << 8) | bytes[1]) % 31 === 0;
    post({ type: 'phase', phase: 'replay_fetch_end', bytes: bytes.byteLength, compressed: gzip || zlib });
    if (gzip) bytes = await inflate(bytes, 'gzip'); else if (zlib) bytes = await inflate(bytes, 'deflate');
    const replay = JSON.parse(new TextDecoder().decode(bytes));
    if (!replay || replay.game !== 'softmax-video-marketing' || !Array.isArray(replay.entries)) throw new Error('not a Softmax Video Marketing replay');
    post({ type: 'phase', phase: 'replay_parsed' });
    applyReplay(replay);
    setTimeout(() => post({ type: 'ready' }), 0);
  }

  function connectLive() {
    state.mode = 'live';
    const url = new URL('../global', location.href); url.protocol = url.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(url.toString());
    ws.onmessage = (ev) => {
      const m = JSON.parse(ev.data);
      if (m.type === 'snapshot') { state.phase = m.phase; state.done = m.done; state.brief = m.brief; state.entries = m.entries; state.results = m.results; }
      else if (m.type === 'phase') state.phase = m.phase;
      else if (m.type === 'seat') { const i = state.entries.findIndex(e => e.slot === m.seat.slot); if (i >= 0) state.entries[i] = { ...state.entries[i], ...m.seat }; else state.entries.push(m.seat); }
      else if (m.type === 'final') { state.results = m.results; state.done = true; state.phase = 'complete'; }
      render();
    };
    ws.onerror = () => showError('Live connection failed.');
    ws.onclose = () => { if (!state.done) $('meta').insertAdjacentHTML('beforeend', '<span>connection closed</span>'); };
    setTimeout(() => post({ type: 'ready' }), 0);
  }

  const replayParam = new URLSearchParams(location.hash.slice(1)).get('replay') || new URLSearchParams(location.search).get('replay');
  if (replayParam) {
    loadReplay(replayParam).catch(err => showError(String(err.message || err)));
  } else if (/\/client\/replay\/?$/.test(location.pathname)) {
    mediaSrc = (slot) => new URL(`../media/${slot}.mp4`, location.href).toString();
    loadReplay(new URL('../replay.json', location.href).toString()).catch(err => showError(String(err.message || err)));
  } else {
    connectLive();
  }
})();
</script>
</body>
</html>
